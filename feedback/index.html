<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>问题反馈 - 图片工具</title>
  <!-- 引入同目录下的独立样式文件 -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div class="feedback-card">
    <!-- 返回官网首页 -->
    <div class="back-nav">
      <a href="../" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        返回官网首页
      </a>
    </div>

    <div class="header">
      <h1>问题反馈与建议</h1>
      <p>如果您在使用过程中遇到问题或有优化建议，请在下方填写。为防止滥用，每个设备每日限提交一次。</p>
    </div>

    <div id="statusAlert" class="alert"></div>

    <form id="feedbackForm">
      <div class="form-group">
        <label class="form-label" for="userEmail">联系邮箱 <span class="required">*</span></label>
        <input type="email" id="userEmail" class="form-control" placeholder="用于接收问题排查结果回复" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="issueDesc">问题描述 <span class="required">*</span></label>
        <textarea id="issueDesc" class="form-control" placeholder="请详细阐述您遇到的问题、操作步骤或软件报错信息..." required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">问题截图（可选，最多 3 张）</label>
        <div class="upload-area" id="dropArea">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <div class="upload-text">点击或拖拽图片至此处，亦支持粘贴截图 (Ctrl+V)</div>
          <input type="file" id="fileInput" accept="image/*" multiple style="display: none;" />
        </div>
        <div class="preview-list" id="previewList"></div>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">提交反馈</button>
    </form>
  </div>

  <!-- 底部版链与导航链接 -->
  <div class="custom-footer">
    <div>© 2026 图片工具 · 本地离线安全 · 专注于效率提升的轻量工具</div>
    <div style="margin-top: 8px;">
      <a href="https://imgto.de5.net/" target="_blank">首页</a> ·
      <a href="https://kzyc.de5.net/" target="_blank">资源仓</a> ·
      <a href="https://imgto.de5.net/" target="_blank">关于软件</a> ·
      <a href="https://imgto.de5.net/feedback/" target="_blank">问题反馈</a>
    </div>
  </div>

  <script>
    // 您的 Cloudflare Worker 接口地址
    const API_ENDPOINT = "https://imgto-feedback.lovefruitmr65.workers.dev";
    
    const LOCAL_STORAGE_KEY = "last_feedback_submit_ts";
    const submitBtn = document.getElementById("submitBtn");
    const alertBox = document.getElementById("statusAlert");
    const fileInput = document.getElementById("fileInput");
    const dropArea = document.getElementById("dropArea");
    const previewList = document.getElementById("previewList");

    let attachedImages = [];

    // 1. 本地检测 24 小时限额
    function checkDailyQuota() {
      const lastSubmit = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (lastSubmit) {
        const diffHours = (Date.now() - parseInt(lastSubmit, 10)) / (1000 * 60 * 60);
        if (diffHours < 24) {
          const remainHours = Math.ceil(24 - diffHours);
          showAlert(`您今天已提交过一次反馈，请于 ${remainHours} 小时后再试。`, "error");
          submitBtn.disabled = true;
          return false;
        }
      }
      return true;
    }

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className = "alert " + (type === "error" ? "alert-error" : "alert-success");
      alertBox.style.display = "block";
    }

    // 2. 拖拽、点击、粘贴上传
    dropArea.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => handleFiles(e.target.files));

    dropArea.addEventListener("dragover", (e) => { e.preventDefault(); dropArea.classList.add("dragover"); });
    dropArea.addEventListener("dragleave", () => dropArea.classList.remove("dragover"));
    dropArea.addEventListener("drop", (e) => {
      e.preventDefault();
      dropArea.classList.remove("dragover");
      handleFiles(e.dataTransfer.files);
    });

    window.addEventListener("paste", (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.type.indexOf("image") !== -1) {
          handleFiles([item.getAsFile()]);
        }
      }
    });

    function handleFiles(files) {
      if (attachedImages.length + files.length > 3) {
        alert("单次最多允许上传 3 张截图");
        return;
      }
      Array.from(files).forEach(file => {
        if (!file.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          attachedImages.push(e.target.result);
          renderPreviews();
        };
        reader.readAsDataURL(file);
      });
    }

    function renderPreviews() {
      previewList.innerHTML = "";
      attachedImages.forEach((src, idx) => {
        const item = document.createElement("div");
        item.className = "preview-item";
        item.innerHTML = `<img src="${src}" /><button type="button" class="remove-btn" onclick="removeImage(${idx})">×</button>`;
        previewList.appendChild(item);
      });
    }

    window.removeImage = function(index) {
      attachedImages.splice(index, 1);
      renderPreviews();
    };

    // 3. 表单提交
    document.getElementById("feedbackForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!checkDailyQuota()) return;

      const email = document.getElementById("userEmail").value.trim();
      const content = document.getElementById("issueDesc").value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = "提交中...";

      try {
        const resp = await fetch(API_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: email,
            content: content,
            images: attachedImages
          })
        });

        const resData = await resp.json();

        if (resp.ok && resData.success) {
          showAlert("反馈已成功送达，感谢您的支持！", "success");
          localStorage.setItem(LOCAL_STORAGE_KEY, Date.now().toString());
          submitBtn.textContent = "今日已提交";
        } else {
          showAlert(resData.message || "提交失败，请稍后重试", "error");
          submitBtn.disabled = false;
          submitBtn.textContent = "提交反馈";
        }
      } catch (err) {
        showAlert("网络异常，无法连接反馈服务器，请稍后再试", "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "提交反馈";
      }
    });

    checkDailyQuota();
  </script>
</body>
</html>
